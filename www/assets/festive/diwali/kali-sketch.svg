<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" fill="none">
  <!-- WISHRITE FESTIVE LINE-ART — MAA KALI ELEGANT SKETCH FOR DIWALI -->
  <defs>
    <linearGradient id="kaliGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1226" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1A1C3B" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <g stroke="url(#kaliGoldStroke)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Ornate Radiant Mukut (Crown) with Crescent Moon & Flame Accents -->
    <path d="M400 90 L400 40 M400 40 L388 65 L400 40 L412 65 Z" stroke-width="2"/>
    <circle cx="400" cy="30" r="5" stroke-width="1.8"/>
    <!-- Crescent Moon on Crown -->
    <path d="M380 95 C380 75, 420 75, 420 95 C410 82, 390 82, 380 95 Z" stroke-width="1.6" fill="#D4AF37" fill-opacity="0.3"/>

    <!-- Arching Mukut Filigree -->
    <path d="M340 140 C370 80, 430 80, 460 140" stroke-width="1.8"/>
    <path d="M310 180 C355 100, 445 100, 490 180" stroke-width="1.8"/>
    <path d="M280 220 C340 120, 460 120, 520 220" stroke-width="1.8"/>
    
    <!-- Crown Ornaments -->
    <circle cx="400" cy="120" r="7"/>
    <circle cx="360" cy="150" r="5"/>
    <circle cx="440" cy="150" r="5"/>
    <circle cx="325" cy="190" r="5"/>
    <circle cx="475" cy="190" r="5"/>

    <!-- Flowing Wild Tresses (Muktakekhi - Open Divine Hair) -->
    <path d="M260 230 C200 300, 160 420, 150 550 C140 680, 110 790, 80 880" stroke-width="1.6"/>
    <path d="M245 250 C185 330, 145 450, 135 590 C125 720, 95 830, 60 920" stroke-width="1.2"/>
    <path d="M540 230 C600 300, 640 420, 650 550 C660 680, 690 790, 720 880" stroke-width="1.6"/>
    <path d="M555 250 C615 330, 655 450, 665 590 C675 720, 705 830, 740 920" stroke-width="1.2"/>

    <!-- Forehead & Trinetra (Third Eye of Transformation) -->
    <path d="M400 270 C416 295, 416 315, 400 340 C384 315, 384 295, 400 270 Z" stroke-width="2"/>
    <circle cx="400" cy="305" r="5" fill="#D4AF37" fill-opacity="0.4"/>
    <circle cx="400" cy="355" r="10" stroke-width="1.8"/>
    <circle cx="400" cy="355" r="6" fill="#8B1E2D" fill-opacity="0.4"/>

    <!-- Eyebrows (Graceful Powerful Arch) -->
    <path d="M305 375 C340 350, 375 352, 390 375" stroke-width="2.4"/>
    <path d="M495 375 C460 350, 425 352, 410 375" stroke-width="2.4"/>

    <!-- Magnificent Expressive Eyes -->
    <!-- Left Eye -->
    <path d="M300 390 C335 368, 370 378, 390 395 C365 412, 328 410, 300 390 Z" stroke-width="2.2"/>
    <path d="M300 390 C288 386, 275 390, 265 396" stroke-width="1.5"/>
    <circle cx="348" cy="392" r="11" stroke-width="1.8"/>
    <circle cx="348" cy="392" r="6" fill="#3D1226" fill-opacity="0.5"/>
    <circle cx="351" cy="390" r="2" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <path d="M500 390 C465 368, 430 378, 410 395 C435 412, 472 410, 500 390 Z" stroke-width="2.2"/>
    <path d="M500 390 C512 386, 525 390, 535 396" stroke-width="1.5"/>
    <circle cx="452" cy="392" r="11" stroke-width="1.8"/>
    <circle cx="452" cy="392" r="6" fill="#3D1226" fill-opacity="0.5"/>
    <circle cx="449" cy="390" r="2" fill="#FFFFFF"/>

    <!-- Nose & Elegant Nath with Pearl Drop -->
    <path d="M400 380 L398 445 C398 460, 408 465, 412 460 C416 456, 412 448, 402 450" stroke-width="1.8"/>
    <circle cx="380" cy="460" r="16" stroke-width="1.8"/>
    <circle cx="380" cy="476" r="3" fill="#D4AF37" fill-opacity="0.5"/>

    <!-- Gentle Regal Expression / Divine Tongue Tip (Raktadantika Tradition) -->
    <path d="M368 508 C385 504, 395 506, 400 510 C405 506, 415 504, 432 508" stroke-width="2"/>
    <path d="M388 512 C388 535, 412 535, 412 512 Z" stroke-width="1.6" fill="#8B1E2D" fill-opacity="0.35"/>
    <path d="M375 530 C390 540, 410 540, 425 530" stroke-width="1.4"/>

    <!-- Chin & Jawline -->
    <path d="M280 345 C280 435, 330 545, 400 575 C470 545, 520 435, 520 345" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Auspicious Diya (Lamp) Motif & Garland Lines -->
    <g stroke-opacity="0.4" stroke-width="1.3">
      <!-- Diya Base under Chin -->
      <path d="M360 680 Q400 710 440 680 Q400 660 360 680 Z"/>
      <!-- Sacred Flame -->
      <path d="M400 660 C392 640, 400 625, 400 620 C400 625, 408 640, 400 660 Z" fill="#D4AF37" fill-opacity="0.3"/>
      <!-- Floral Garland (Jaba Kusum / Hibiscus Outline) -->
      <circle cx="320" cy="650" r="14"/>
      <circle cx="480" cy="650" r="14"/>
      <circle cx="270" cy="680" r="16"/>
      <circle cx="530" cy="680" r="16"/>
    </g>

    <!-- Radiating Halo & Starburst of Lights -->
    <g stroke-dasharray="2,10" stroke-width="1" stroke-opacity="0.4">
      <circle cx="400" cy="330" r="300"/>
      <circle cx="400" cy="330" r="360"/>
    </g>
  </g>
</svg>
