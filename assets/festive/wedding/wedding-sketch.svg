<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" fill="none">
  <!-- WISHRITE FESTIVE LINE-ART — BENGALI BRIDAL TOPOR, MUKUT & ROYAL JEWELLERY -->
  <defs>
    <linearGradient id="wedGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1824" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9E2A2B" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <g stroke="url(#wedGoldStroke)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Traditional Shola Bridal Mukut (Bengali Bou Mukut) -->
    <path d="M400 90 L400 50 M400 50 L388 70 L400 50 L412 70 Z" stroke-width="2"/>
    <circle cx="400" cy="40" r="5" stroke-width="1.8"/>

    <!-- Mukut Tiered Floral Arches -->
    <path d="M350 140 C380 90, 420 90, 450 140" stroke-width="1.8"/>
    <path d="M320 180 C365 110, 435 110, 480 180" stroke-width="1.8"/>
    <path d="M290 220 C350 130, 450 130, 510 220" stroke-width="1.8"/>

    <!-- Intricate Alpona Motifs on Mukut -->
    <circle cx="400" cy="115" r="7"/>
    <circle cx="360" cy="150" r="5"/>
    <circle cx="440" cy="150" r="5"/>
    <circle cx="325" cy="190" r="5"/>
    <circle cx="475" cy="190" r="5"/>

    <!-- Bridal Matha-Patti & Tikli (Forehead Ornament) -->
    <path d="M280 250 Q400 275 520 250" stroke-width="2"/>
    <path d="M285 262 Q400 288 515 262" stroke-dasharray="3,5" stroke-width="1.5"/>
    <!-- Tikli Drop with Pearl -->
    <line x1="400" y1="275" x2="400" y2="330" stroke-width="1.8"/>
    <circle cx="400" cy="336" r="8" stroke-width="1.8"/>
    <circle cx="400" cy="336" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    <circle cx="400" cy="350" r="3"/>

    <!-- Bridal Chandan Art on Brow (Kalka Dots) -->
    <path d="M320 345 Q360 335 390 345" stroke-dasharray="2,6" stroke-width="2"/>
    <path d="M480 345 Q440 335 410 345" stroke-dasharray="2,6" stroke-width="2"/>
    <!-- Big Vermilion Bridal Bindi -->
    <circle cx="400" cy="375" r="10" stroke-width="2"/>
    <circle cx="400" cy="375" r="6" fill="#7B1824" fill-opacity="0.4"/>

    <!-- Eyebrows (Graceful Wedding Arch) -->
    <path d="M310 395 C340 375, 375 378, 388 400" stroke-width="2.4"/>
    <path d="M490 395 C460 375, 425 378, 412 400" stroke-width="2.4"/>

    <!-- Downcast Modest Bridal Eyes (Lajjabati Bou) -->
    <!-- Left Eye -->
    <path d="M305 410 C335 392, 370 400, 390 415 C365 428, 330 425, 305 410 Z" stroke-width="2.2"/>
    <circle cx="350" cy="414" r="8" stroke-width="1.6"/>
    <circle cx="350" cy="414" r="4" fill="#7B1824" fill-opacity="0.4"/>
    <!-- Lashes -->
    <path d="M325 422 L320 428 M345 424 L345 431 M365 422 L370 428" stroke-width="1.2"/>

    <!-- Right Eye -->
    <path d="M495 410 C465 392, 430 400, 410 415 C435 428, 470 425, 495 410 Z" stroke-width="2.2"/>
    <circle cx="450" cy="414" r="8" stroke-width="1.6"/>
    <circle cx="450" cy="414" r="4" fill="#7B1824" fill-opacity="0.4"/>
    <!-- Lashes -->
    <path d="M475 422 L480 428 M455 424 L455 431 M435 422 L430 428" stroke-width="1.2"/>

    <!-- Nose & Royal Bridal Nath with Chain to Ear -->
    <path d="M400 400 L398 460 C398 472, 408 476, 412 472" stroke-width="1.8"/>
    <!-- Oversized Wedding Nath -->
    <circle cx="375" cy="470" r="22" stroke-width="2"/>
    <circle cx="375" cy="492" r="4" fill="#D4AF37" fill-opacity="0.5"/>
    <path d="M353 470 C310 450, 260 400, 240 370" stroke-dasharray="3,6" stroke-width="1.4"/>

    <!-- Bridal Lips (Smile of New Beginnings) -->
    <path d="M368 518 C385 512, 395 515, 400 520 C405 515, 415 512, 432 518 C418 535, 382 535, 368 518 Z" stroke-width="2"/>
    <path d="M382 532 C395 538, 405 538, 418 532" stroke-width="1.4"/>

    <!-- Bridal Veil (Banarasi Chador / Urni Drape) -->
    <path d="M280 250 C220 310, 180 420, 170 580 C160 740, 130 860, 100 940" stroke-width="1.8"/>
    <path d="M520 250 C580 310, 620 420, 630 580 C640 740, 670 860, 700 940" stroke-width="1.8"/>
    <!-- Zari Paisley Border on Veil -->
    <path d="M265 270 C205 340, 168 450, 155 600" stroke-dasharray="4,8" stroke-width="1.4"/>
    <path d="M535 270 C595 340, 632 450, 645 600" stroke-dasharray="4,8" stroke-width="1.4"/>

    <!-- Heirloom Bridal Choker & Chik Necklace -->
    <path d="M340 610 Q400 635 460 610" stroke-width="2"/>
    <path d="M335 628 Q400 655 465 628" stroke-dasharray="4,6" stroke-width="1.6"/>
    <path d="M330 648 Q400 678 470 648" stroke-width="2"/>
    <!-- Statement Pendant -->
    <path d="M390 660 L410 660 L400 685 Z" stroke-width="1.8"/>
    <circle cx="400" cy="695" r="5" fill="#D4AF37" fill-opacity="0.4"/>
  </g>
</svg>
