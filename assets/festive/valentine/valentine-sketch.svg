<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" fill="none">
  <!-- WISHRITE FESTIVE LINE-ART — VALENTINE'S BOTANICAL ROSE & DELICATE HEART -->
  <defs>
    <linearGradient id="valGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C1D2E" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C44569" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <g stroke="url(#valGoldStroke)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Rose Bloom (Artistic Single Line Contour) -->
    <!-- Inner Spiral -->
    <path d="M400 240 C390 230, 410 215, 420 230 C430 245, 395 260, 385 245 C375 220, 425 200, 440 235 C450 265, 375 285, 360 250" stroke-width="1.8"/>
    <!-- Middle Petals -->
    <path d="M370 230 C340 210, 320 260, 350 285 C375 305, 425 310, 450 280 C475 250, 450 210, 420 210" stroke-width="1.8"/>
    <path d="M340 260 C300 270, 310 330, 360 345 C410 360, 460 350, 480 310 C500 270, 470 240, 440 250" stroke-width="1.8"/>
    <!-- Outer Broad Petals -->
    <path d="M320 300 C270 320, 280 400, 350 420 C420 440, 480 430, 520 370 C550 310, 510 260, 470 270" stroke-width="2"/>
    <path d="M310 380 C260 410, 290 480, 370 495 C450 510, 520 480, 540 420" stroke-width="1.8"/>

    <!-- Delicate Slender Stem & Leaves -->
    <path d="M400 480 C405 560, 385 640, 390 730 C395 810, 410 880, 400 940" stroke-width="2"/>
    <!-- Leaf 1 (Left) -->
    <path d="M395 560 C320 540, 270 580, 260 620 C290 640, 370 610, 395 580 Z" stroke-width="1.6"/>
    <path d="M395 560 C330 580, 290 600, 260 620" stroke-width="1.2"/>
    <!-- Leaf 2 (Right) -->
    <path d="M390 650 C460 630, 510 660, 520 700 C490 720, 415 695, 390 670 Z" stroke-width="1.6"/>
    <path d="M390 650 C450 665, 490 685, 520 700" stroke-width="1.2"/>

    <!-- Subtle Minimalist Heart Halo Embracing the Rose -->
    <path d="M400 220 C360 140, 200 160, 200 320 C200 470, 340 590, 400 680 C460 590, 600 470, 600 320 C600 160, 440 140, 400 220 Z" stroke-width="1.4" stroke-dasharray="4,8"/>

    <!-- Floating Stardust / Sparkles -->
    <g stroke-width="1.2">
      <path d="M220 220 L220 240 M210 230 L230 230"/>
      <path d="M580 230 L580 250 M570 240 L590 240"/>
      <path d="M180 400 L180 416 M172 408 L188 408"/>
      <path d="M620 410 L620 426 M612 418 L628 418"/>
    </g>
  </g>
</svg>
